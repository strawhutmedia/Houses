name: Refresh listings & deploy

# Pulls fresh government-auction data on a schedule and publishes the site
# (with the generated listings.json) to GitHub Pages.
#
# Cadence: every 3 hours. County tax sales don't change minute-to-minute, so
# every few hours keeps the feed current without hammering the sources. Adjust
# the cron below if you want it faster/slower. You can also trigger it by hand
# from the Actions tab (workflow_dispatch).
#
# Setup once: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}      # manual "Run workflow" button (Actions tab)
  push:
    branches:                # redeploy on site changes
      - main
      - claude/website-from-screenshots-iz682e

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A real browser is available here (no sandbox proxy), so the headless
      # CWS adapter (Treasury + US Marshals) can render. Installing the
      # playwright npm package makes require("playwright") resolve in the scraper.
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright >/dev/null 2>&1
          npx --yes playwright install --with-deps chromium

      - name: Scrape sources -> listings.json
        run: node scraper/run.js
        continue-on-error: true   # never block a deploy on one flaky source
        env:
          # Set this repo secret to turn on AI equity estimates + photo-condition
          # ratings (Settings -> Secrets and variables -> Actions -> New secret).
          # Left unset, the scraper simply skips enrichment.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ES_ENRICH_LIMIT: "40"

      - name: Scrape LA studio/commercial spaces -> spaces.json
        run: node scraper/spaces.js
        continue-on-error: true   # Craigslist can IP-block CI; last good spaces.json stays

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Tolerate "Pages not enabled yet" so runs don't spam failure emails before
    # the one-time setup (Settings -> Pages -> Source: GitHub Actions). Once
    # Pages is enabled this step publishes for real; you can drop this line then.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
